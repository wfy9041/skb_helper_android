plugins {
    id "com.android.application"
}

android {
    namespace "com.wx.skb.hostapp"
    compileSdk 33
    ndkVersion "21.1.6352462"

    defaultConfig {
        applicationId "com.wx.skb.hostapp"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.2.0"

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "release") {
                output.outputFileName = "SkbDebugTool-v${variant.versionName}-release.apk"
            }
        }
    }

    sourceSets.main.java.srcDirs = ["src/main/java"]
}

dependencies {
    // Build and package the local SDK automatically when building the host app.
    implementation project(":skb-sdk")
}
